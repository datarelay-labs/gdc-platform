# Air-gapped / offline production stack — pre-loaded images only (no build, no pull).
#
# Used by scripts/build-offline-package.sh and scripts/offline/install-offline.sh.
# Images must be loaded first: images/load-images.sh
#
# Run from the offline package root (parent of configs/):
#   docker compose -f configs/docker-compose.offline.yml --env-file configs/.env up -d
#
# Compared to docker-compose.platform.yml:
#   - No dev-validation fixtures (WireMock, webhook echo, syslog).
#   - No host repo bind-mount or docker.sock on the API container.
#   - pull_policy: never (offline hosts have no registry access).
#   - APP_ENV=production, ENABLE_DEV_VALIDATION_LAB=false by default.

name: gdc-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdc-platform-postgres
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gdc}
      POSTGRES_USER: ${POSTGRES_USER:-gdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gdc_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdc} -d ${POSTGRES_DB:-gdc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${GDC_PLATFORM_POSTGRES_HOST_PORT:-55432}:5432"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    image: gdc-platform-api:offline
    container_name: gdc-platform-api
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gdc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gdc}
      GDC_DB_POOL_SIZE: ${GDC_DB_POOL_SIZE:-6}
      GDC_DB_MAX_OVERFLOW: ${GDC_DB_MAX_OVERFLOW:-6}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      GDC_RUNTIME_IN_CONTAINER: "true"
      APP_ENV: production
      ENABLE_DEV_VALIDATION_LAB: "false"
      DEV_VALIDATION_AUTO_START: "false"
      GDC_SEED_ADMIN_PASSWORD: ${GDC_SEED_ADMIN_PASSWORD:-}
      REQUIRE_AUTH: "true"
      AUTH_DEV_HEADER_TRUST: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      GDC_TRUST_PROXY_HEADERS: "true"
      GDC_PROXY_FORWARD_TRUSTED_HOSTS: "*"
      GDC_TLS_CERT_PATH: /var/gdc/tls/server.crt
      GDC_TLS_KEY_PATH: /var/gdc/tls/server.key
      GDC_NGINX_TLS_CERT_CONTAINER_PATH: /var/gdc/tls/server.crt
      GDC_NGINX_TLS_KEY_CONTAINER_PATH: /var/gdc/tls/server.key
      GDC_NGINX_CONF_PATH: /var/gdc/nginx/default.conf
      GDC_UPSTREAM_API_HOST: api
      GDC_UPSTREAM_API_PORT: "8000"
      GDC_UPSTREAM_UI_HOST: frontend
      GDC_UPSTREAM_UI_PORT: "80"
      GDC_PROXY_RELOAD_URL: http://reverse-proxy:8099/__gdc_internal/reload
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:?GDC_PROXY_RELOAD_TOKEN is required}
      GDC_PROXY_INTERNAL_HEALTH_URL: http://reverse-proxy/health
      GDC_HTTP_PORT: ${GDC_HTTP_PORT:-18080}
      GDC_HTTPS_PORT: ${GDC_HTTPS_PORT:-18443}
      GDC_PUBLIC_HTTPS_PORT: ${GDC_PUBLIC_HTTPS_PORT:-${GDC_HTTPS_PORT:-18443}}
    volumes:
      - gdc_platform_tls:/var/gdc/tls
      - gdc_platform_nginx:/var/gdc/nginx
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GDC_API_HOST_PORT:-8000}:8000"
    mem_limit: ${GDC_API_MEM_LIMIT:-10g}
    memswap_limit: ${GDC_API_MEMSWAP_LIMIT:-14g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.db.seed --platform-admin-only && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  frontend:
    image: gdc-platform-frontend:offline
    container_name: gdc-platform-frontend
    pull_policy: never
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  reverse-proxy:
    image: gdc-platform-reverse-proxy:offline
    container_name: gdc-platform-reverse-proxy
    pull_policy: never
    environment:
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:?GDC_PROXY_RELOAD_TOKEN is required}
      GDC_UPSTREAM_API_HOST: api
      GDC_UPSTREAM_API_PORT: "8000"
      GDC_UPSTREAM_UI_HOST: frontend
      GDC_UPSTREAM_UI_PORT: "80"
    ports:
      - "${GDC_HTTP_PORT:-18080}:80"
      - "${GDC_HTTPS_PORT:-18443}:443"
    volumes:
      - gdc_platform_tls:/var/gdc/tls
      - gdc_platform_nginx:/etc/nginx/conf.d
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  gdc_platform_postgres_data:
  gdc_platform_tls:
  gdc_platform_nginx:
