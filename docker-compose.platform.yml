# Full stack: PostgreSQL + API + static frontend + nginx reverse proxy (single browser entrypoint).
# Production-style bind-mounted TLS and no DB/API host publish: deploy/docker-compose.https.yml
# (see docs/deployment/https-reverse-proxy.md).
#
# Database: bundled `postgres` uses catalog `gdc` (compose volume `gdc_platform_postgres_data`).
# Host pytest must use catalog `gdc_pytest` on a dedicated test stack (see tests/db_test_policy.py).
# Host tools / Alembic for the API: align DATABASE_URL in .env with the compose postgres service.
#
# Development validation lab bootstrap:
# `docker compose -f docker-compose.platform.yml up -d` starts the core HTTP
# fixtures (WireMock, webhook echo, syslog sink), runs migrations, seeds lab
# streams, including source-expansion visibility fixtures, and auto-runs
# StreamRunner-backed validations. The dev-validation bootstrap starts the
# backing S3, database-query, and remote-file fixture services.
# The administrator bootstrap contract is username `admin`, password `admin`
# when GDC_SEED_ADMIN_PASSWORD is unset. A fresh bootstrap always sets
# must_change_password=true, and existing admin rows are not reset by startup.
# Do not reintroduce generated admin passwords or compose-level password
# defaults.
#
# For the full source-expansion lab: ./scripts/validation-lab/start.sh
# (docs/testing/dev-validation-lab.md).
#
# Browser (via nginx): http://localhost:${GDC_HTTP_PORT:-18080}
#   HTTPS (after Admin → HTTPS): https://localhost:${GDC_HTTPS_PORT:-18443}
# Direct API on the host: http://localhost:${GDC_API_HOST_PORT:-8000} (see `api` service `ports` below).
# Production-style host ports: set GDC_HTTP_PORT=80 GDC_HTTPS_PORT=443 GDC_PUBLIC_HTTPS_PORT=443.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdc-platform-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gdc}
      POSTGRES_USER: ${POSTGRES_USER:-gdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gdc}
    volumes:
      - gdc_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdc} -d ${POSTGRES_DB:-gdc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${GDC_PLATFORM_POSTGRES_HOST_PORT:-55432}:5432"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: gdc-platform-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gdc}:${POSTGRES_PASSWORD:-gdc}@postgres:5432/${POSTGRES_DB:-gdc}
      GDC_DB_POOL_SIZE: ${GDC_DB_POOL_SIZE:-12}
      GDC_DB_MAX_OVERFLOW: ${GDC_DB_MAX_OVERFLOW:-12}
      # Reduce glibc per-thread arena fragmentation in long-lived uvicorn workers.
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      GDC_RUNTIME_IN_CONTAINER: "true"
      GDC_ROUTE_PROCESSING_ENABLED: ${GDC_ROUTE_PROCESSING_ENABLED:-true}
      GDC_ENABLE_IN_PROCESS_SCHEDULER: ${GDC_ENABLE_IN_PROCESS_SCHEDULER:-false}
      GDC_UVICORN_WORKERS: ${GDC_UVICORN_WORKERS:-2}
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_VALIDATION_LAB: ${ENABLE_DEV_VALIDATION_LAB:-true}
      DEV_VALIDATION_AUTO_START: ${DEV_VALIDATION_AUTO_START:-true}
      GDC_SEED_ADMIN_PASSWORD: ${GDC_SEED_ADMIN_PASSWORD:-}
      ENABLE_DEV_VALIDATION_S3: ${ENABLE_DEV_VALIDATION_S3:-true}
      ENABLE_DEV_VALIDATION_DATABASE_QUERY: ${ENABLE_DEV_VALIDATION_DATABASE_QUERY:-true}
      ENABLE_DEV_VALIDATION_REMOTE_FILE: ${ENABLE_DEV_VALIDATION_REMOTE_FILE:-true}
      ENABLE_DEV_VALIDATION_PERFORMANCE: ${ENABLE_DEV_VALIDATION_PERFORMANCE:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://gdc-minio-test:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gdcminioaccess}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-gdcminioaccesssecret12}
      MINIO_BUCKET: ${MINIO_BUCKET:-gdc-test-logs}
      DEV_VALIDATION_PG_QUERY_HOST: ${DEV_VALIDATION_PG_QUERY_HOST:-gdc-postgres-query-test}
      DEV_VALIDATION_PG_QUERY_PORT: ${DEV_VALIDATION_PG_QUERY_PORT:-5432}
      DEV_VALIDATION_MYSQL_QUERY_HOST: ${DEV_VALIDATION_MYSQL_QUERY_HOST:-gdc-mysql-query-test}
      DEV_VALIDATION_MYSQL_QUERY_PORT: ${DEV_VALIDATION_MYSQL_QUERY_PORT:-3306}
      DEV_VALIDATION_MARIADB_QUERY_HOST: ${DEV_VALIDATION_MARIADB_QUERY_HOST:-gdc-mariadb-query-test}
      DEV_VALIDATION_MARIADB_QUERY_PORT: ${DEV_VALIDATION_MARIADB_QUERY_PORT:-3306}
      DEV_VALIDATION_SFTP_HOST: ${DEV_VALIDATION_SFTP_HOST:-gdc-sftp-test}
      DEV_VALIDATION_SFTP_PORT: ${DEV_VALIDATION_SFTP_PORT:-22}
      DEV_VALIDATION_SFTP_PASSWORD: ${DEV_VALIDATION_SFTP_PASSWORD:-devlab123}
      DEV_VALIDATION_SSH_SCP_HOST: ${DEV_VALIDATION_SSH_SCP_HOST:-gdc-ssh-scp-test}
      DEV_VALIDATION_SSH_SCP_PORT: ${DEV_VALIDATION_SSH_SCP_PORT:-22}
      DEV_VALIDATION_SSH_SCP_PASSWORD: ${DEV_VALIDATION_SSH_SCP_PASSWORD:-devlab456}
      DEV_VALIDATION_WIREMOCK_BASE_URL: http://gdc-platform-wiremock-test:8080
      DEV_VALIDATION_WEBHOOK_BASE_URL: http://gdc-webhook-receiver-test:8080
      DEV_VALIDATION_SYSLOG_HOST: gdc-syslog-test
      DEV_VALIDATION_SYSLOG_PORT: "5514"
      # Dev-validation startup must be immediately inspectable by smoke checks and UI/API probes.
      REQUIRE_AUTH: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      GDC_TRUST_PROXY_HEADERS: "true"
      GDC_PROXY_FORWARD_TRUSTED_HOSTS: "*"
      GDC_TLS_CERT_PATH: /var/gdc/tls/server.crt
      GDC_TLS_KEY_PATH: /var/gdc/tls/server.key
      GDC_NGINX_TLS_CERT_CONTAINER_PATH: /var/gdc/tls/server.crt
      GDC_NGINX_TLS_KEY_CONTAINER_PATH: /var/gdc/tls/server.key
      GDC_NGINX_CONF_PATH: /var/gdc/nginx/default.conf
      GDC_UPSTREAM_API_HOST: api
      GDC_UPSTREAM_API_PORT: "8000"
      GDC_UPSTREAM_UI_HOST: frontend
      GDC_UPSTREAM_UI_PORT: "80"
      GDC_PROXY_RELOAD_URL: http://reverse-proxy:8099/__gdc_internal/reload
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:-devtoken}
      GDC_PROXY_INTERNAL_HEALTH_URL: http://reverse-proxy/health
      GDC_HTTP_PORT: ${GDC_HTTP_PORT:-18080}
      GDC_HTTPS_PORT: ${GDC_HTTPS_PORT:-18443}
      GDC_PUBLIC_HTTPS_PORT: ${GDC_PUBLIC_HTTPS_PORT:-${GDC_HTTPS_PORT:-18443}}
      GDC_PLATFORM_ENV_PATH: ${PWD:-/workspace}/.env
      GDC_PLATFORM_COMPOSE_ROOT: ${PWD:-/workspace}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-gdc-platform}
    volumes:
      - gdc_platform_tls:/var/gdc/tls
      - gdc_platform_nginx:/var/gdc/nginx
      - ${PWD:-.}:${PWD:-/workspace}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      gdc-wiremock-test:
        condition: service_started
      gdc-webhook-receiver-test:
        condition: service_started
      gdc-syslog-test:
        condition: service_started
    ports:
      - "${GDC_API_HOST_PORT:-8000}:8000"
    networks:
      - default
      - gdc-dev-validation
    # Cap runaway RSS while allowing modest swap spill (host has ~20GiB RAM + swap).
    mem_limit: ${GDC_API_MEM_LIMIT:-10g}
    memswap_limit: ${GDC_API_MEMSWAP_LIMIT:-14g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed --platform-admin-only && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${GDC_UVICORN_WORKERS:-2}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: gdc-platform-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gdc}:${POSTGRES_PASSWORD:-gdc}@postgres:5432/${POSTGRES_DB:-gdc}
      GDC_DB_POOL_SIZE: ${GDC_SCHEDULER_DB_POOL_SIZE:-8}
      GDC_DB_MAX_OVERFLOW: ${GDC_SCHEDULER_DB_MAX_OVERFLOW:-8}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      GDC_RUNTIME_IN_CONTAINER: "true"
      GDC_ROUTE_PROCESSING_ENABLED: ${GDC_ROUTE_PROCESSING_ENABLED:-true}
      GDC_ENABLE_IN_PROCESS_SCHEDULER: "true"
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_VALIDATION_LAB: ${ENABLE_DEV_VALIDATION_LAB:-true}
      DEV_VALIDATION_AUTO_START: ${DEV_VALIDATION_AUTO_START:-true}
      DEV_VALIDATION_WIREMOCK_BASE_URL: http://gdc-platform-wiremock-test:8080
      DEV_VALIDATION_WEBHOOK_BASE_URL: http://gdc-webhook-receiver-test:8080
      DEV_VALIDATION_SYSLOG_HOST: gdc-syslog-test
      DEV_VALIDATION_SYSLOG_PORT: "5514"
      REQUIRE_AUTH: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - default
      - gdc-dev-validation
    mem_limit: ${GDC_SCHEDULER_MEM_LIMIT:-4g}
    memswap_limit: ${GDC_SCHEDULER_MEMSWAP_LIMIT:-6g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: ["sh", "-c", "python -m app.scheduler.standalone"]
    # Override image HEALTHCHECK (Dockerfile.api probes uvicorn :8000). Standalone
    # scheduler has no HTTP listener; verify the process itself is running.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib; raise SystemExit(0 if any(b'app.scheduler.standalone' in p.read_bytes() for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  gdc-wiremock-test:
    image: wiremock/wiremock:3.9.1
    volumes:
      - ./tests/wiremock:/home/wiremock
    # Avoid --verbose request dumps (primary cause of 100G+ json-file growth).
    command: ["--max-request-journal-entries", "500"]
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - gdc-platform-wiremock-test
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    cpus: "1.0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  gdc-webhook-receiver-test:
    image: mendhak/http-https-echo:33
    environment:
      HTTP_PORT: "8080"
    expose:
      - "8080"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    cpus: "0.5"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  gdc-syslog-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.syslog-test
    image: gdc-syslog-test:local
    expose:
      - "5514/tcp"
      - "5514/udp"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    cpus: "0.5"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_OSS_RELEASE_MODE: ${VITE_OSS_RELEASE_MODE:-true}
    container_name: gdc-platform-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  reverse-proxy:
    build:
      context: ./docker/reverse-proxy
      dockerfile: Dockerfile
    container_name: gdc-platform-reverse-proxy
    environment:
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:-devtoken}
      GDC_UPSTREAM_API_HOST: api
      GDC_UPSTREAM_API_PORT: "8000"
      GDC_UPSTREAM_UI_HOST: frontend
      GDC_UPSTREAM_UI_PORT: "80"
    ports:
      - "${GDC_HTTP_PORT:-18080}:80"
      - "${GDC_HTTPS_PORT:-18443}:443"
    volumes:
      - gdc_platform_tls:/var/gdc/tls
      - gdc_platform_nginx:/etc/nginx/conf.d
    healthcheck:
      # HTTPS-enabled nginx redirects :80 → HTTPS; probe HTTPS first. Fall back to
      # HTTP 200 without following redirects (bootstrap HTTP-only mode).
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || wget --max-redirect=0 -S -O /dev/null http://127.0.0.1/health 2>&1 | grep -q ' 200 '",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  gdc_platform_postgres_data:
  gdc_platform_tls:
  gdc_platform_nginx:

networks:
  default:
    name: gdc-platform_default
  gdc-dev-validation:
    external: true
