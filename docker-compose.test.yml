# Dedicated development / CI test stack (isolated network and ports). Not a product runtime.
# Usage: export COMPOSE_PROFILES=test
#        docker compose -f docker-compose.test.yml up -d postgres-test wiremock-test webhook-receiver-test syslog-test
# External runtime E2E (all fixtures):
#        ./scripts/testing/start-external-runtime-e2e-stack.sh
#        ./scripts/test/run-external-runtime-e2e-tests.sh
#
# Host defaults (no clash with developer postgres:5432 / wiremock:18080):
#   PostgreSQL smoke: 127.0.0.1:${GDC_TEST_POSTGRES_HOST_PORT:-55441}
#     databases gdc (API/lab) + gdc_pytest (host pytest only)
#   PostgreSQL ontology pytest: 127.0.0.1:55440 → gdc_ontology_test (host pytest default; see tests/db_test_policy.py)
#   WireMock:   127.0.0.1:28080
#   Toxiproxy API / source / dest proxies: 127.0.0.1:28474 / 28081 / 28082
#   Webhook echo: 127.0.0.1:18091
#   TCP/UDP sink: 127.0.0.1:15514 (raw listener for isolation; pytest syslog E2E uses in-process receivers)
#   TLS syslog sink: 127.0.0.1:16514 → container :6514 (self-signed dev cert; insecure_skip_verify in lab)
#   MinIO (test profile): 127.0.0.1:59000 API, 127.0.0.1:59001 console
#   PostgreSQL fixture DB (DATABASE_QUERY E2E): 127.0.0.1:55433
#   SFTP fixture (REMOTE_FILE E2E): 127.0.0.1:22222

name: gdc-platform-test

# Shared logging + fixture resource caps.
# WireMock memory matches docker-compose.platform.yml (512m/768m).
# CPU/PID were previously unset on E2E paths; keep them modest and uniform.
x-gdc-logging: &gdc-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

networks:
  gdc-dev-validation:
    name: gdc-dev-validation
    driver: bridge

volumes:
  gdc_test_postgres_data:
  gdc_ontology_test_postgres_data:
  gdc_minio_test_data:
  gdc_postgres_query_data:
  gdc_mysql_query_data:
  gdc_mariadb_query_data:
  gdc_sftp_test_data:
  gdc_ssh_scp_test_data:

services:
  postgres-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: postgres:16-alpine
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-postgres-test
    networks:
      - gdc-dev-validation
    environment:
      POSTGRES_DB: gdc
      POSTGRES_USER: gdc
      POSTGRES_PASSWORD: gdc
    ports:
      - "127.0.0.1:${GDC_TEST_POSTGRES_HOST_PORT:-55441}:5432"
    volumes:
      - gdc_test_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdc -d gdc"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_POSTGRES_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_POSTGRES_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_POSTGRES_CPUS:-1.0}
    pids_limit: ${GDC_E2E_POSTGRES_PIDS_LIMIT:-512}

  postgres-ontology-test:
    # Host pytest default (tests/db_test_policy.py, .env.test.ontology): 127.0.0.1:55440/gdc_ontology_test
    profiles: ["test", "ontology-test"]
    image: postgres:16-alpine
    container_name: ${GDC_ONTOLOGY_TEST_CONTAINER_PREFIX:-gdc}-postgres-ontology-test
    networks:
      - gdc-dev-validation
    environment:
      POSTGRES_DB: gdc_ontology_test
      POSTGRES_USER: gdc_ontology
      POSTGRES_PASSWORD: gdc_ontology_pw
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - gdc_ontology_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdc_ontology -d gdc_ontology_test"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_POSTGRES_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_POSTGRES_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_POSTGRES_CPUS:-1.0}
    pids_limit: ${GDC_E2E_POSTGRES_PIDS_LIMIT:-512}

  wiremock-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: wiremock/wiremock:3.9.1
    # Prefix isolates parallel worktrees; omit override to let Compose name by project.
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-wiremock-test
    networks:
      - gdc-dev-validation
    ports:
      - "127.0.0.1:${GDC_TEST_WIREMOCK_HOST_PORT:-28080}:8080"
    volumes:
      - ./tests/wiremock:/home/wiremock
    # No --verbose: request/response dumps filled disks (100G+). Journal capped for admin API.
    command: ["--max-request-journal-entries", "500"]
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_WIREMOCK_MEM_LIMIT:-512m}
    memswap_limit: ${GDC_E2E_WIREMOCK_MEMSWAP_LIMIT:-768m}
    cpus: ${GDC_E2E_WIREMOCK_CPUS:-1.0}
    pids_limit: ${GDC_E2E_WIREMOCK_PIDS_LIMIT:-512}

  # TCP-level fault injection in front of WireMock (HTTP source + webhook dest).
  # Proxies are created at runtime via the Toxiproxy API (see tests/e2e_toxiproxy_helpers.py).
  # Upstream defaults to {GDC_TEST_CONTAINER_PREFIX}-wiremock-test:8080 on this network.
  toxiproxy-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-toxiproxy-test
    networks:
      - gdc-dev-validation
    ports:
      - "127.0.0.1:${GDC_TEST_TOXIPROXY_API_HOST_PORT:-28474}:8474"
      - "127.0.0.1:${GDC_TEST_TOXIPROXY_SOURCE_HOST_PORT:-28081}:18080"
      - "127.0.0.1:${GDC_TEST_TOXIPROXY_DEST_HOST_PORT:-28082}:18081"
    # Distroless image: readiness is probed from the host (scripts/tests) via :8474/version.
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_LIGHT_MEM_LIMIT:-256m}
    memswap_limit: ${GDC_E2E_LIGHT_MEMSWAP_LIMIT:-384m}
    cpus: ${GDC_E2E_LIGHT_CPUS:-0.5}
    pids_limit: ${GDC_E2E_LIGHT_PIDS_LIMIT:-256}

  webhook-receiver-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: mendhak/http-https-echo:33
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-webhook-receiver-test
    networks:
      - gdc-dev-validation
    ports:
      - "127.0.0.1:${GDC_TEST_WEBHOOK_ECHO_HOST_PORT:-18091}:8080"
    environment:
      HTTP_PORT: "8080"
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_LIGHT_MEM_LIMIT:-256m}
    memswap_limit: ${GDC_E2E_LIGHT_MEMSWAP_LIMIT:-384m}
    cpus: ${GDC_E2E_LIGHT_CPUS:-0.5}
    pids_limit: ${GDC_E2E_LIGHT_PIDS_LIMIT:-256}

  syslog-test:
    profiles: ["test", "dev-validation", "e2e"]
    build:
      context: .
      dockerfile: docker/Dockerfile.syslog-test
    image: gdc-syslog-test:local
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-syslog-test
    networks:
      - gdc-dev-validation
    ports:
      - "127.0.0.1:${GDC_TEST_SYSLOG_HOST_PORT:-15514}:5514/tcp"
      - "127.0.0.1:${GDC_TEST_SYSLOG_HOST_PORT:-15514}:5514/udp"
      - "127.0.0.1:${GDC_TEST_SYSLOG_TLS_HOST_PORT:-16514}:6514/tcp"
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_LIGHT_MEM_LIMIT:-256m}
    memswap_limit: ${GDC_E2E_LIGHT_MEMSWAP_LIMIT:-384m}
    cpus: ${GDC_E2E_LIGHT_CPUS:-0.5}
    pids_limit: ${GDC_E2E_LIGHT_PIDS_LIMIT:-256}

  # --- Optional dev-validation-only fixtures (S3 / DATABASE_QUERY / REMOTE_FILE_POLLING lab) ---
  minio-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: minio/minio:latest
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-minio-test
    networks:
      - gdc-dev-validation
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${GDC_TEST_MINIO_API_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${GDC_TEST_MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    environment:
      MINIO_ROOT_USER: gdcminioaccess
      MINIO_ROOT_PASSWORD: gdcminioaccesssecret12
    volumes:
      - gdc_minio_test_data:/data
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_MINIO_MEM_LIMIT:-512m}
    memswap_limit: ${GDC_E2E_MINIO_MEMSWAP_LIMIT:-768m}
    cpus: ${GDC_E2E_MINIO_CPUS:-1.0}
    pids_limit: ${GDC_E2E_MINIO_PIDS_LIMIT:-512}

  postgres-query-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: postgres:16-alpine
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-postgres-query-test
    networks:
      - gdc-dev-validation
    environment:
      POSTGRES_USER: gdc_fixture
      POSTGRES_PASSWORD: gdc_fixture_pw
      POSTGRES_DB: gdc_query_fixture
    ports:
      - "127.0.0.1:${GDC_TEST_PG_FIXTURE_HOST_PORT:-55433}:5432"
    volumes:
      - gdc_postgres_query_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdc_fixture -d gdc_query_fixture"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_POSTGRES_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_POSTGRES_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_POSTGRES_CPUS:-1.0}
    pids_limit: ${GDC_E2E_POSTGRES_PIDS_LIMIT:-512}

  mysql-query-test:
    profiles: ["dev-validation"]
    image: mysql:8.4
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-mysql-query-test
    networks:
      - gdc-dev-validation
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: gdc_query_fixture
      MYSQL_USER: gdc_fixture
      MYSQL_PASSWORD: gdc_fixture_pw
    ports:
      - "127.0.0.1:${GDC_DEV_VALIDATION_MYSQL_HOST_PORT:-33306}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - gdc_mysql_query_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugdc_fixture", "-pgdc_fixture_pw"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_POSTGRES_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_POSTGRES_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_POSTGRES_CPUS:-1.0}
    pids_limit: ${GDC_E2E_POSTGRES_PIDS_LIMIT:-512}

  mariadb-query-test:
    profiles: ["dev-validation"]
    image: mariadb:11.4
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-mariadb-query-test
    networks:
      - gdc-dev-validation
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: gdc_query_fixture
      MARIADB_USER: gdc_fixture
      MARIADB_PASSWORD: gdc_fixture_pw
    ports:
      - "127.0.0.1:${GDC_DEV_VALIDATION_MARIADB_HOST_PORT:-33307}:3306"
    volumes:
      - gdc_mariadb_query_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_POSTGRES_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_POSTGRES_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_POSTGRES_CPUS:-1.0}
    pids_limit: ${GDC_E2E_POSTGRES_PIDS_LIMIT:-512}

  sftp-test:
    profiles: ["test", "dev-validation", "e2e"]
    image: atmoz/sftp:alpine
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-sftp-test
    networks:
      - gdc-dev-validation
    ports:
      - "127.0.0.1:${GDC_TEST_SFTP_HOST_PORT:-22222}:22"
    volumes:
      - gdc_sftp_test_data:/home/gdc/upload
    command: ["gdc:devlab123:1001:1001:upload"]
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_LIGHT_MEM_LIMIT:-256m}
    memswap_limit: ${GDC_E2E_LIGHT_MEMSWAP_LIMIT:-384m}
    cpus: ${GDC_E2E_LIGHT_CPUS:-0.5}
    pids_limit: ${GDC_E2E_LIGHT_PIDS_LIMIT:-256}

  ssh-scp-test:
    profiles: ["dev-validation"]
    image: atmoz/sftp:alpine
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-ssh-scp-test
    networks:
      - gdc-dev-validation
    ports:
      - "22223:22"
    volumes:
      - gdc_ssh_scp_test_data:/home/gdc2/upload
    command: ["gdc2:devlab456:1002:1002:upload"]
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_LIGHT_MEM_LIMIT:-256m}
    memswap_limit: ${GDC_E2E_LIGHT_MEMSWAP_LIMIT:-384m}
    cpus: ${GDC_E2E_LIGHT_CPUS:-0.5}
    pids_limit: ${GDC_E2E_LIGHT_PIDS_LIMIT:-256}

  pytest-runner:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.pytest-runner
    image: gdc-pytest-runner:local
    container_name: ${GDC_TEST_CONTAINER_PREFIX:-gdc}-pytest-runner
    networks:
      - gdc-dev-validation
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      TEST_DATABASE_URL: postgresql://gdc:gdc@postgres-test:5432/gdc_pytest
      WIREMOCK_BASE_URL: http://wiremock-test:8080
      PGOPTIONS: "-c lock_timeout=5000 -c statement_timeout=120000"
    depends_on:
      postgres-test:
        condition: service_healthy
      wiremock-test:
        condition: service_started
    tty: true
    logging: *gdc-logging
    mem_limit: ${GDC_E2E_PYTEST_MEM_LIMIT:-2g}
    memswap_limit: ${GDC_E2E_PYTEST_MEMSWAP_LIMIT:-3g}
    cpus: ${GDC_E2E_PYTEST_CPUS:-2.0}
    pids_limit: ${GDC_E2E_PYTEST_PIDS_LIMIT:-1024}
