name: gdc-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdc-platform-postgres
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gdc}
      POSTGRES_USER: ${POSTGRES_USER:-gdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gdc_platform_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gdc} -d ${POSTGRES_DB:-gdc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    image: gdc-platform-api:offline
    container_name: gdc-platform-api
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gdc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gdc}
      APP_ENV: production
      REQUIRE_AUTH: "true"
      AUTH_DEV_HEADER_TRUST: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:?GDC_PROXY_RELOAD_TOKEN is required}
      GDC_SEED_ADMIN_PASSWORD: ${GDC_SEED_ADMIN_PASSWORD:-}
      ENABLE_DEV_VALIDATION_LAB: "false"
      DEV_VALIDATION_AUTO_START: "false"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    image: gdc-platform-frontend:offline
    container_name: gdc-platform-frontend
    pull_policy: never
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  reverse-proxy:
    image: gdc-platform-reverse-proxy:offline
    container_name: gdc-platform-reverse-proxy
    pull_policy: never
    environment:
      GDC_PROXY_RELOAD_TOKEN: ${GDC_PROXY_RELOAD_TOKEN:?GDC_PROXY_RELOAD_TOKEN is required}
      GDC_UPSTREAM_API_HOST: api
      GDC_UPSTREAM_API_PORT: "8000"
      GDC_UPSTREAM_UI_HOST: frontend
      GDC_UPSTREAM_UI_PORT: "80"
    ports:
      - "18080:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  gdc_platform_postgres_data:
